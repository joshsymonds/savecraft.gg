sources = ["gamatron"]

[author]
name = "Josh Symonds"
github = "joshsymonds"

# --- Reference modules (save-independent), generated from the game's shipped
# data and in-game guide. ---

[reference.modules.guide]
name = "Mechanics Guide"
description = "Look up Songs of Syx gameplay mechanics from the game's own shipped in-game guide and room notes. Returns a table of contents (the menu of systems to search), full article text by key, or keyword matches — all dev-written, version-matched prose. Use PROACTIVELY before answering ANY question about how a system works (happiness, services, immigration, farming, military, trade, world map, law): this game is niche and easily mis-remembered, so ground and cite the article instead of guessing. If nothing relevant comes back, say you're unsure rather than invent an answer; for strategy or opinion the shipped docs don't cover (e.g. best race, optimal build order), reason transparently from the live mechanics and label it as your reasoning, not fact."
requires_save = false

[reference.modules.rooms]
name = "Room & Building Lookup"
description = "Look up any Songs of Syx room/building's base-tier stats and the game's own description: resource build cost, what it produces and consumes per worker, whether it provides a citizen service, and the farmed crop for farms. Pass 'room' (an ID or fuzzy name) for one building, or omit it (with optional 'category') to list all. Use for any question about what a building costs, produces, consumes, or provides."
requires_save = false

[reference.modules.resources]
name = "Resource Lookup"
description = "Look up any Songs of Syx resource/good: its roles (edible, drinkable, growable, minable, supply, work), spoilage rate, the game's own description, and — cross-referenced from the buildings — which rooms produce and consume it. Pass 'resource' (an ID or fuzzy name) for one good, or omit it (with optional 'role') to list all. Use for resource and production-chain questions."
requires_save = false

[reference.modules.races]
name = "Race & Species Lookup"
description = "Look up any Songs of Syx species: whether it's playable, its preferred foods, slave price, baby/child maturation days, and the game's own description. Pass 'race' (an ID or fuzzy name) for one species, or omit it to list all. Use for population, happiness-by-food-preference, and species questions."
requires_save = false

[reference.modules.tech]
name = "Knowledge Tree Lookup"
description = "Look up any Songs of Syx technology: its knowledge-point cost, the population threshold and prerequisite techs it requires, what it unlocks, and the game's own description. Pass 'tech' (a key or fuzzy name) for one technology, or omit it (with optional 'category') to list all. Use for research-planning and unlock-path questions."
requires_save = false
