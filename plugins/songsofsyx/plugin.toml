name = "Songs of Syx"
description = "Reference for the colony-sim/4X Songs of Syx, generated verbatim from the game's own shipped data and in-game guide: searchable dev-written mechanics articles plus room, resource, race, and knowledge-tree lookups. This game is niche and easily mis-remembered — retrieve and cite these before answering rather than relying on memory. Live colony state via an in-game mod is forthcoming."
channel = "alpha"
coverage = "partial"
