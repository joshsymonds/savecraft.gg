game_id = "songsofsyx"
sources = ["mod"]
icon = "icon.png"
name = "Songs of Syx"
description = "Reference for the colony-sim/4X Songs of Syx: the game's own in-game mechanics guide, searchable and citable, generated verbatim from the shipped data. Room/resource/race/tech stat lookups and live colony state via an in-game mod are forthcoming."
channel = "alpha"
coverage = "partial"
homepage = "https://savecraft.gg/plugins/songsofsyx"

limitations = [
  "Reference data only for now — the in-game mod that pushes live colony state is not yet shipped",
  "Reference data is generated from the game-shipped data files for a single game version; modded content is not included",
]

[attribution]
sources = ["gamatron"]

[author]
name = "Josh Symonds"
github = "joshsymonds"

# --- Reference modules (save-independent). Only implemented modules are
# declared; tech is added as its datagen + handler land. ---

[reference.modules.guide]
name = "Mechanics Guide"
description = "Look up Songs of Syx gameplay mechanics from the game's own shipped in-game guide and room notes. Returns a table of contents, full article text by key, or keyword matches — all dev-written, version-matched prose. Use PROACTIVELY before answering ANY question about how a system works (happiness, services, immigration, farming, military, trade, world map, law): this game is niche and easily mis-remembered, so ground and cite the article instead of guessing."
requires_save = false

[reference.modules.rooms]
name = "Room & Building Lookup"
description = "Look up any Songs of Syx room/building's base-tier stats and the game's own description: resource build cost, what it produces and consumes per worker, whether it provides a citizen service, and the farmed crop for farms. Pass 'room' (an ID or fuzzy name) for one building, or omit it (with optional 'category') to list all. Use for any question about what a building costs, produces, consumes, or provides."
requires_save = false

[reference.modules.resources]
name = "Resource Lookup"
description = "Look up any Songs of Syx resource/good: its roles (edible, drinkable, growable, minable, supply, work), spoilage rate, the game's own description, and — cross-referenced from the buildings — which rooms produce and consume it. Pass 'resource' (an ID or fuzzy name) for one good, or omit it (with optional 'role') to list all. Use for resource and production-chain questions."
requires_save = false

[reference.modules.races]
name = "Race & Species Lookup"
description = "Look up any Songs of Syx species: whether it's playable, its preferred foods, slave price, baby/child maturation days, and the game's own description. Pass 'race' (an ID or fuzzy name) for one species, or omit it to list all. Use for population, happiness-by-food-preference, and species questions."
requires_save = false
