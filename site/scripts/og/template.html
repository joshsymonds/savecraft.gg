<!doctype html>
<!--
  OG card template. Rendered by generate-og.mjs via file:// at 1200x630.
  All colors and fonts come from the site's design tokens (base.css) —
  no values duplicated here, so cards track the brand automatically.
  Card content arrives as query params: ?eyebrow=…&title=…&shot=…
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../../shared/styles/base.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 72px;
        background:
          radial-gradient(ellipse at 85% 20%, var(--color-gold-soft) 0%, transparent 55%),
          radial-gradient(ellipse at 15% 90%, var(--color-surface-tint) 0%, transparent 60%),
          var(--color-bg);
        border-bottom: 6px solid var(--color-gold);
      }

      .text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .eyebrow {
        font-family: var(--font-heading);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 4px;
        color: var(--color-gold);
      }

      .title {
        font-family: var(--font-pixel);
        font-size: 40px;
        line-height: 1.6;
        color: var(--color-text);
        margin: 0;
      }

      .wordmark {
        margin-top: auto;
        font-family: var(--font-heading);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--color-text-muted);
      }

      .wordmark .domain {
        color: var(--color-gold);
      }

      .frame {
        flex-shrink: 0;
        width: 430px;
        border: 1px solid var(--color-gold);
        border-radius: 4px;
        box-shadow:
          0 0 40px var(--color-gold-soft),
          0 24px 60px rgb(0 0 0 / 50%);
        transform: rotate(2deg);
        overflow: hidden;
        background: var(--color-panel-bg);
      }

      .frame img {
        display: block;
        width: 100%;
        height: 460px;
        object-fit: cover;
        object-position: top;
      }

      .text,
      .frame {
        height: 460px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="title" id="title"></h1>
        <div class="wordmark">SAVECRAFT <span class="domain">savecraft.gg</span></div>
      </div>
      <div class="frame">
        <img id="shot" alt="" />
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("eyebrow").textContent = params.get("eyebrow") ?? "";
      document.getElementById("title").textContent = params.get("title") ?? "";
      document.getElementById("shot").src = "../../static/" + (params.get("shot") ?? "");
    </script>
  </body>
</html>
